[project]
name = "lakehouse-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ygor Morais Jaques", email = "ymjaques@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "delta-spark==4.0.0",
    "jupyterlab>=4.6.4",
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyspark==4.0.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
lakehouse-lab = "lakehouse_lab:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
